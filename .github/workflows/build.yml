name: Build Mutqin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13113456"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Show Flutter dependency tree
        run: flutter pub deps --style=compact

      - name: Verify Android embedding
        run: |
          echo "========================================"
          echo "GIT COMMIT"
          echo "========================================"
          git rev-parse HEAD

          echo "========================================"
          echo "ANDROID MANIFEST"
          echo "========================================"
          cat android/app/src/main/AndroidManifest.xml

          echo "========================================"
          echo "EMBEDDING CHECK"
          echo "========================================"
          grep -n 'flutterEmbedding\|android:value="2"\|android:name="${applicationName}"' \
            android/app/src/main/AndroidManifest.xml

          echo "========================================"
          echo "FLUTTER VERSION"
          echo "========================================"
          flutter --version

      - name: Build APK
        run: flutter build apk --release -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mutqin-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
